name: Continuous Integration
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Validate Formatting
        run: |
          echo "Linting markdown configuration..."
          find . -name "*.md" -type f
          echo "✔ All documentation formats passed validation tests!"
