name: "🚀 Feature Request"
description: Propose a new feature, enhancement, or architectural design idea for this repository.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ### Have a cool idea? We'd love to hear it!
        Describe your proposal below so we can discuss the feasibility, architecture, and implementation.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem or limitation is. (e.g. "I am frustrated when...")
      placeholder: Provide context on the user pain point...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the Proposed Solution
      description: A clear and concise description of what you want to happen. What features or behavior would you like to see?
      placeholder: Describe the desired feature or API design...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe Alternatives You've Considered
      description: A clear and concise description of any alternative solutions or workarounds you've considered or implemented.
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, mockup screenshots, or links about the feature request here.
    validations:
      required: false
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution Interest
      options:
        - label: I would be willing to submit a pull request implementing this feature!
          required: false
