changelog:
  exclude:
    labels:
      - ignore-for-release
      - duplicate
    authors:
      - octocat
  categories:
    - title: "🚀 New Features"
      labels:
        - enhancement
        - feature
    - title: "🐛 Bug Fixes"
      labels:
        - bug
        - fix
    - title: "🧪 Maintenance & Tooling"
      labels:
        - chore
        - ci
        - documentation
